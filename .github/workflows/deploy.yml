name: Deploy

# 本番は、既定ブランチ（main または master）への push で CI が成功したあと。手動実行も本番。
# プルリクエストは preview。CLOUDFLARE_API_TOKEN か CLOUDFLARE_ACCOUNT_ID が無ければスキップする（失敗にしない）。
# 資源の ID と公開先の違いは npm run deploy が読む。
# 渡す環境変数: DEPLOY_TARGET, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID, D1_PREVIEW_DATABASE_ID
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: gate
        id: gate
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          account=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          if [ -z "$token" ] || [ -z "$account" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN または CLOUDFLARE_ACCOUNT_ID が未設定のためデプロイをスキップします"
            exit 0
          fi
          echo "::add-mask::$token"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          {
            echo "CLOUDFLARE_API_TOKEN=$token"
            echo "CLOUDFLARE_ACCOUNT_ID=$account"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - name: install
        if: steps.gate.outputs.skip != 'true'
        run: npm ci
      - name: build
        if: steps.gate.outputs.skip != 'true'
        run: npm run build
      - name: deploy
        if: steps.gate.outputs.skip != 'true'
        run: npm run deploy
        env:
          DEPLOY_TARGET: production
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_PREVIEW_DATABASE_ID: ${{ vars.D1_PREVIEW_DATABASE_ID }}
      - name: summary
        if: steps.gate.outputs.skip != 'true' && success()
        run: |
          if [ -f deploy-result.txt ]; then
            cat deploy-result.txt >> "$GITHUB_STEP_SUMMARY"
          fi

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: gate
        id: gate
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAW_PREVIEW: ${{ vars.D1_PREVIEW_DATABASE_ID }}
        run: |
          token=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          account=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          preview=$(printf '%s' "$RAW_PREVIEW" | tr -d '[:space:]')
          if [ -z "$token" ] || [ -z "$account" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN または CLOUDFLARE_ACCOUNT_ID が未設定のためデプロイをスキップします"
            exit 0
          fi
          if [ -z "$preview" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::D1_PREVIEW_DATABASE_ID が未設定のためプレビューをスキップします"
            exit 0
          fi
          echo "::add-mask::$token"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          {
            echo "CLOUDFLARE_API_TOKEN=$token"
            echo "CLOUDFLARE_ACCOUNT_ID=$account"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - name: install
        if: steps.gate.outputs.skip != 'true'
        run: npm ci
      - name: build
        if: steps.gate.outputs.skip != 'true'
        run: npm run build
      - name: deploy
        if: steps.gate.outputs.skip != 'true'
        run: npm run deploy
        env:
          DEPLOY_TARGET: preview
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_PREVIEW_DATABASE_ID: ${{ vars.D1_PREVIEW_DATABASE_ID }}
      - name: summary
        if: steps.gate.outputs.skip != 'true' && success()
        run: |
          if [ -f deploy-result.txt ]; then
            cat deploy-result.txt >> "$GITHUB_STEP_SUMMARY"
          fi
