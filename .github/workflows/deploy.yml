name: Deploy

# 既定ブランチが main でも master でも同じファイルで動く。
# 本番公開は、そのブランチへの push の CI が成功したあと。プルリクエストでは preview ジョブだけが動く。
# CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID が無いときは失敗させずにスキップする。
# D1_DATABASE_ID と D1_PREVIEW_DATABASE_ID は、使うリポジトリだけ Variables に入れる。解釈は npm run deploy に任せる。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
          && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: secrets
        id: secrets
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAW_PREVIEW: ${{ vars.D1_PREVIEW_DATABASE_ID }}
          DEPLOY_TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
        run: |
          set -euo pipefail
          token=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          account=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          preview=$(printf '%s' "$RAW_PREVIEW" | tr -d '[:space:]')
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if [ -z "$token" ] || [ -z "$account" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN または CLOUDFLARE_ACCOUNT_ID が未設定のため、公開をスキップしました"
            exit 0
          fi
          if [ "$DEPLOY_TARGET" = "preview" ] && ! printf '%s' "$preview" | grep -Eq "$uuid"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::D1_PREVIEW_DATABASE_ID が未設定のため、プレビュー公開をスキップしました。本番のデータには触れていません。"
            exit 0
          fi
          echo "::add-mask::$token"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          {
            echo "CLOUDFLARE_API_TOKEN=$token"
            echo "CLOUDFLARE_ACCOUNT_ID=$account"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - name: install
        if: steps.secrets.outputs.skip != 'true'
        run: npm ci
      - name: build
        if: steps.secrets.outputs.skip != 'true'
        run: npm run build
      - name: deploy
        if: steps.secrets.outputs.skip != 'true'
        env:
          DEPLOY_TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          DEPLOY_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_PREVIEW_DATABASE_ID: ${{ vars.D1_PREVIEW_DATABASE_ID }}
        run: npm run deploy

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: preview-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: secrets
        id: secrets
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAW_PREVIEW: ${{ vars.D1_PREVIEW_DATABASE_ID }}
          DEPLOY_TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
        run: |
          set -euo pipefail
          token=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          account=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          preview=$(printf '%s' "$RAW_PREVIEW" | tr -d '[:space:]')
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if [ -z "$token" ] || [ -z "$account" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN または CLOUDFLARE_ACCOUNT_ID が未設定のため、公開をスキップしました"
            exit 0
          fi
          if [ "$DEPLOY_TARGET" = "preview" ] && ! printf '%s' "$preview" | grep -Eq "$uuid"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::D1_PREVIEW_DATABASE_ID が未設定のため、プレビュー公開をスキップしました。本番のデータには触れていません。"
            exit 0
          fi
          echo "::add-mask::$token"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          {
            echo "CLOUDFLARE_API_TOKEN=$token"
            echo "CLOUDFLARE_ACCOUNT_ID=$account"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - name: install
        if: steps.secrets.outputs.skip != 'true'
        run: npm ci
      - name: build
        if: steps.secrets.outputs.skip != 'true'
        run: npm run build
      - name: deploy
        if: steps.secrets.outputs.skip != 'true'
        env:
          DEPLOY_TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          DEPLOY_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_PREVIEW_DATABASE_ID: ${{ vars.D1_PREVIEW_DATABASE_ID }}
        run: npm run deploy
