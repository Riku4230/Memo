name: E2E

# メモ固有。共通の ci.yml には入れない。main にあったブラウザの通し確認（e2e/run.mjs）。
# 主な画面のスモークは ci.yml の npm run test:e2e。こちらは公開（Deploy）を待たせない。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: ローカル用の設定（テスト専用のセットアップトークン）
        run: cp .dev.vars.example .dev.vars && sed -i 's/change-me-to-a-long-random-string/local-dev-setup-token-1234567890/' .dev.vars
      - run: npm run db:migrate:local
      - name: Worker をローカルで起動
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8787/api/auth/me >/dev/null && exit 0; sleep 2; done
          cat wrangler.log; exit 1
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-screenshots
          path: |
            e2e/screenshots/
            wrangler.log
