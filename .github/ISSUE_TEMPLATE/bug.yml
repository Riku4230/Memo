name: バグ
description: 期待と違う動き、壊れているところ
title: "バグ: "
labels: ["bug"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: どの画面で、何をしようとしたときに起きるか
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: やりたいこと
      description: 期待する動き
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了条件（受け入れ条件）
      description: 直ったと判断できる状態
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: テスト方法
      description: 再現手順と、直ったことを確かめる手順
    validations:
      required: true
