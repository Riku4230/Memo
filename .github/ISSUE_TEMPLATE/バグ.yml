name: バグ
description: 期待と違う動きを直す
title: "バグ: "
labels:
  - bug
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: どの画面で、何をしたら、何が起きたか。期待していた動きも書く
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: やりたいこと
      description: 直ったあとにどうなっているべきか
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件（受け入れ条件）
      description: 再現手順のどこが、どうなれば直ったと言えるか
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: テスト方法
      description: 再発を防ぐ確認。手元の手順、または自動テスト
    validations:
      required: true
